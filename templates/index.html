<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orquestrador Titanic | Premium Studio</title>
    <!-- Importando a fonte Inter para visual Apple/Vercel -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: { zinc: { 950: "#09090b" } },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #09090b;
        color: #ffffff;
        font-family: "Inter", sans-serif;
        height: 100vh;
        overflow: hidden;
        background-image:
          radial-gradient(
            circle at 50% 0%,
            rgba(59, 130, 246, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(147, 51, 234, 0.1) 0%,
            transparent 50%
          );
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }

      .loader {
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top: 2px solid #3b82f6;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .btn-premium {
        background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
        box-shadow:
          0 0 20px rgba(59, 130, 246, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-premium:hover {
        transform: translateY(-1px);
        box-shadow:
          0 0 30px rgba(59, 130, 246, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .btn-premium:active {
        transform: translateY(1px);
      }
      .btn-premium:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .glass-panel {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(15px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .node-anim {
        animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
    </style>
  </head>
  <body class="flex h-screen antialiased selection:bg-blue-500/30">
    <!-- Painel Esquerdo (Controles) -->
    <div
      class="w-[400px] border-r border-white/5 flex flex-col h-full overflow-y-auto relative z-10"
    >
      <!-- Header Premium -->
      <div class="p-8 pb-6 border-b border-white/5">
        <div class="flex items-center gap-3 mb-2">
          <div
            class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]"
          >
            <svg
              class="w-5 h-5 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              ></path>
            </svg>
          </div>
          <h1 class="text-xl font-semibold tracking-tight text-white">
            Titanic Studio
          </h1>
        </div>
        <p class="text-sm text-zinc-400">AI Acquisition Engine B2B</p>
      </div>

      <div class="p-8 flex-grow space-y-8">
        <!-- Input de Prompt -->
        <div class="space-y-3">
          <label
            class="text-xs font-semibold text-zinc-400 uppercase tracking-wider"
            >Briefing do Cliente</label
          >
          <div class="relative group">
            <textarea
              id="brief"
              rows="6"
              class="w-full bg-zinc-900/50 border border-white/10 rounded-xl p-4 text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all placeholder-zinc-600 resize-none"
              placeholder="Cole aqui a história da empresa, público-alvo, diferenciais e links de fotos. Ex: 'Advocacia Silva, fundada em 1990...'"
            ></textarea>
            <div
              class="absolute inset-0 rounded-xl pointer-events-none border border-blue-500/0 group-focus-within:border-blue-500/30 transition-colors"
            ></div>
          </div>
        </div>

        <!-- Select de Motor -->
        <div class="space-y-3">
          <label
            class="text-xs font-semibold text-zinc-400 uppercase tracking-wider"
            >Motor de Conversão (Nicho)</label
          >
          <div class="relative">
            <select
              id="engine"
              class="w-full bg-zinc-900/50 border border-white/10 rounded-xl p-4 text-sm text-zinc-200 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all cursor-pointer"
            >
              <option value="Advocacia">
                Advocacia (Autoridade e Confiança)
              </option>
              <option value="Imobiliaria">
                Imobiliária (Luxo e Imagens Grandes)
              </option>
              <option value="Clinica">
                Clínica (Saúde, Estética e Bem-estar)
              </option>
              <option value="Concessionaria">
                Concessionária (Performance e Velocidade)
              </option>
              <option value="Premium">Premium Genérico (Design Moderno)</option>
            </select>
            <div
              class="absolute inset-y-0 right-4 flex items-center pointer-events-none"
            >
              <svg
                class="w-4 h-4 text-zinc-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- Botão de Ação -->
        <button
          id="generateBtn"
          onclick="generateSite()"
          class="btn-premium w-full text-white font-medium py-3.5 rounded-xl text-sm flex items-center justify-center gap-2"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            ></path>
          </svg>
          Gerar Proposta Comercial
        </button>

        <!-- Área de Status -->
        <div id="statusArea" class="hidden">
          <div class="glass-panel p-4 rounded-xl flex items-center gap-3 mb-6">
            <div id="spinner" class="loader hidden shrink-0"></div>
            <div class="flex-1">
              <p
                class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1"
              >
                Status Atual
              </p>
              <p
                id="statusText"
                class="text-xs font-medium text-blue-400 truncate"
              >
                Iniciando pipeline...
              </p>
            </div>
          </div>

          <div class="mb-8">
            <p
              class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-4"
            >
              Agent Workflow
            </p>
            <div
              id="agentPipeline"
              class="flex flex-col gap-4 relative before:absolute before:inset-0 before:ml-[11px] before:w-0.5 before:bg-zinc-800 -z-10"
            ></div>
          </div>

          <div id="flowchartContainer" class="hidden">
            <p
              class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider mb-4 flex items-center gap-2"
            >
              <svg
                class="w-3 h-3 text-blue-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                ></path>
              </svg>
              User Journey Protocol
            </p>
            <div id="flowchart" class="space-y-3 relative"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Painel Direito (Preview) -->
    <div class="flex-1 p-6 flex flex-col h-full relative z-10">
      <div
        class="w-full h-full rounded-2xl bg-zinc-900 border border-white/10 shadow-2xl flex flex-col overflow-hidden"
      >
        <div
          class="h-12 bg-zinc-950 border-b border-white/5 flex items-center px-4 gap-4"
        >
          <div class="flex gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
          </div>
          <div
            class="flex-1 bg-zinc-900 rounded-md h-8 flex items-center px-3 border border-white/5"
          >
            <svg
              class="w-3 h-3 text-zinc-500 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              ></path>
            </svg>
            <span class="text-xs text-zinc-400 font-mono" id="urlBar"
              >about:blank</span
            >
          </div>
          <a
            href="#"
            target="_blank"
            id="openNewTab"
            class="hidden text-xs font-medium text-blue-400 hover:text-blue-300 transition-colors flex items-center gap-1"
          >
            Abrir em Nova Aba
            <svg
              class="w-3 h-3"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
              ></path>
            </svg>
          </a>
        </div>

        <div class="flex-1 bg-white relative">
          <div
            id="placeholder"
            class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950 text-zinc-600"
          >
            <div
              class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mb-6 animate-pulse"
            >
              <svg
                class="w-8 h-8 text-zinc-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
                ></path>
              </svg>
            </div>
            <p class="font-medium text-sm text-zinc-400">
              Aguardando proposta...
            </p>
            <p class="text-xs text-zinc-600 mt-2 max-w-xs text-center">
              O site de vendas será renderizado aqui em instantes.
            </p>
          </div>
          <iframe
            id="previewFrame"
            class="w-full h-full border-0 hidden"
            src="about:blank"
          ></iframe>
        </div>
      </div>
    </div>

    <script>
      let pollingInterval;

      async function generateSite() {
        const brief = document.getElementById("brief").value;
        const engine = document.getElementById("engine").value;
        const btn = document.getElementById("generateBtn");
        const statusArea = document.getElementById("statusArea");
        const statusText = document.getElementById("statusText");
        const spinner = document.getElementById("spinner");
        const flowchartContainer =
          document.getElementById("flowchartContainer");
        const placeholder = document.getElementById("placeholder");
        const iframe = document.getElementById("previewFrame");
        const openNewTab = document.getElementById("openNewTab");
        const urlBar = document.getElementById("urlBar");

        if (!brief.trim())
          return alert("Por favor, cole o briefing do cliente.");

        btn.disabled = true;
        btn.innerHTML = `<div class="loader mr-2 border-white/30 border-t-white"></div> Processando Proposta...`;

        statusArea.classList.remove("hidden");
        flowchartContainer.classList.add("hidden");
        spinner.classList.remove("hidden");
        statusText.innerText = "Iniciando orquestração...";

        placeholder.innerHTML = `
                <div class="w-16 h-16 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
                <p class="text-sm text-blue-400 font-mono tracking-widest uppercase">Compilando Design System</p>
            `;
        iframe.classList.add("hidden");
        iframe.src = "about:blank";
        openNewTab.classList.add("hidden");
        urlBar.innerText = "about:blank";

        try {
          const res = await fetch("http://127.0.0.1:5050/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ brief, engine }),
          });

          if (!res.ok) throw new Error("Falha na comunicação com o servidor.");

          if (pollingInterval) clearInterval(pollingInterval);
          pollingInterval = setInterval(checkStatus, 1500);
        } catch (error) {
          statusText.innerText = "❌ " + error.message;
          spinner.classList.add("hidden");
          resetBtn(true); // <--- AQUI: Botão de erro
        }
      }

      async function checkStatus() {
        try {
          const res = await fetch("http://127.0.0.1:5050/status");
          const data = await res.json();

          const statusText = document.getElementById("statusText");
          const spinner = document.getElementById("spinner");
          const flowchartContainer =
            document.getElementById("flowchartContainer");

          statusText.innerText = data.status;
          updateAgentPipeline(data.status);

          if (
            data.plan &&
            data.plan.user_journey &&
            flowchartContainer.classList.contains("hidden")
          ) {
            renderUserJourney(data.plan.user_journey);
            flowchartContainer.classList.remove("hidden");
          }

          if (!data.is_generating && data.status.includes("Concluído")) {
            clearInterval(pollingInterval);
            spinner.classList.add("hidden");
            resetBtn(false); // <--- AQUI: Botão de sucesso
            updateAgentPipeline("✅ Concluído! O site está pronto.");
            showIframe(data.project_folder);
          }

          if (data.status.includes("❌")) {
            clearInterval(pollingInterval);
            spinner.classList.add("hidden");
            resetBtn(true); // <--- AQUI: Botão de erro
          }
        } catch (error) {
          console.error("Erro no polling", error);
        }
      }

      function updateAgentPipeline(statusMsg) {
        const pipeline = document.getElementById("agentPipeline");
        const steps = [
          {
            id: "plan",
            label: "Analisando Nicho",
            keywords: ["[1/5]", "[2/5]", "Pesquisa", "Planejando"],
          },
          {
            id: "code",
            label: "Escrevendo Copy & Layout",
            keywords: ["[3/5]", "Construindo Frontend", "Criando index"],
          },
          {
            id: "qa",
            label: "Auditando Conversão (CRO)",
            keywords: ["QA", "Auditoria", "Revisor"],
          },
          {
            id: "logic",
            label: "Aplicando Micro-interações",
            keywords: [
              "[4/5]",
              "[5/5]",
              "Mecânicas",
              "Animações",
              "Criando js",
            ],
          },
          { id: "done", label: "Proposta Pronta", keywords: ["Concluído"] },
        ];

        let currentStepIndex = -1;
        for (let i = 0; i < steps.length; i++) {
          if (steps[i].keywords.some((k) => statusMsg.includes(k))) {
            currentStepIndex = i;
            break;
          }
        }

        if (statusMsg.includes("Concluído"))
          currentStepIndex = steps.length - 1;

        pipeline.innerHTML = steps
          .map((step, index) => {
            let stateClass = "border-zinc-800 text-zinc-600 bg-zinc-900";
            let icon = `<div class="w-2 h-2 rounded-full bg-zinc-700"></div>`;
            let textClass = "text-zinc-600";

            if (index < currentStepIndex) {
              stateClass =
                "border-blue-900/50 text-blue-500 bg-zinc-950 shadow-[0_0_10px_rgba(59,130,246,0.1)]";
              icon = `<svg class="w-3 h-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
              textClass = "text-zinc-400";
            } else if (index === currentStepIndex) {
              stateClass =
                "border-blue-500 text-white bg-blue-900/20 shadow-[0_0_15px_rgba(59,130,246,0.3)]";
              icon = `<div class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></div>`;
              textClass = "text-white font-semibold";
            }

            return `
                <div class="relative z-10 flex items-center gap-3 bg-zinc-950 pr-2 rounded-lg transition-all duration-500">
                    <div class="w-6 h-6 rounded-full border ${stateClass} flex items-center justify-center shrink-0 transition-colors duration-500">
                        ${icon}
                    </div>
                    <span class="text-xs ${textClass} transition-colors duration-500">${step.label}</span>
                </div>
            `;
          })
          .join("");
      }

      function renderUserJourney(journey) {
        const container = document.getElementById("flowchart");
        container.innerHTML = "";
        journey.forEach((step, index) => {
          const node = document.createElement("div");
          node.className = "relative z-10 flex items-start gap-3 node-anim";
          node.style.animationDelay = `${index * 0.15}s`;
          node.innerHTML = `
                    <div class="w-6 h-6 mt-1 rounded bg-zinc-900 border border-white/10 flex items-center justify-center shrink-0">
                        <span class="text-[10px] font-mono text-zinc-500">${index + 1}</span>
                    </div>
                    <div class="flex-1 glass-panel p-3 rounded-xl border border-white/5 hover:border-white/10 transition-colors">
                        <p class="text-xs text-zinc-300 leading-relaxed">${step}</p>
                    </div>
                `;
          container.appendChild(node);
        });
      }

      function showIframe(projectFolder = "") {
        const iframe = document.getElementById("previewFrame");
        const placeholder = document.getElementById("placeholder");
        const urlBar = document.getElementById("urlBar");
        const openNewTab = document.getElementById("openNewTab");

        const timestamp = new Date().getTime();
        const basePath =
          window.location.origin +
          window.location.pathname.replace("index.html", "");
        let folderPath = projectFolder ? `${projectFolder}/` : "";
        let url = `${basePath}workspace/${folderPath}index.html?t=${timestamp}`;

        iframe.src = url;
        placeholder.classList.add("hidden");
        iframe.classList.remove("hidden");
        urlBar.innerText = url.replace(window.location.origin, "");
        openNewTab.href = `${basePath}workspace/${folderPath}index.html`;
        openNewTab.classList.remove("hidden");
      }

      function resetBtn(isError = false) {
        const btn = document.getElementById("generateBtn");
        btn.disabled = false;
        if (isError) {
          btn.innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Tentar Novamente`;
          btn.classList.add("bg-red-600", "hover:bg-red-700");
          btn.classList.remove("btn-premium");
        } else {
          btn.innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Gerar Proposta Comercial`;
          btn.classList.remove("bg-red-600", "hover:bg-red-700");
          btn.classList.add("btn-premium");
        }
      }
    </script>
  </body>
</html>
